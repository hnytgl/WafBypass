schema_version: 1
product: Apache Generic
version: '2026.09'
detection:
  # Only match on error pages (403/404), not normal content
  status_rules:
    - status: [403, 404, 500]
      patterns:
        - regex: "apache"
          fields: [server]
        - regex: "you.don.t.have.permission.to.access."
          fields: [body]
        - regex: "was.not.found.on.this.server"
          fields: [body]
        - regex: "<address>apache/([\\d+{1,2}](.[\\d+]{1,2}(.[\\d+]{1,3})?)?)?"
          fields: [body]
  patterns:
    # Only match specific Apache error page markers in body (not generic "apache")
    - regex: "<title>403 Forbidden</title>.*apache"
      fields: [body]
    - regex: "<address>Apache/\\d"
      fields: [body]
confidence: low
false_positive_risk: high
