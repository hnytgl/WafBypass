schema_version: 1
product: Apache Generic
version: '2026.09'
detection:
  patterns:
  - regex: apache
    fields: &id001
    - body
    - server
  - regex: you.don.t.have.permission.to.access.
    fields: *id001
  - regex: was.not.found.on.this.server
    fields: *id001
  - regex: <address>apache/([\d+{1,2}](.[\d+]{1,2}(.[\d+]{1,3})?)?)?
    fields: *id001
  status_rules:
  - status:
    - 403
    patterns:
    - regex: apache
      fields:
      - server
    - regex: you.don.t.have.permission.to.access.
      fields:
      - server
    - regex: was.not.found.on.this.server
      fields:
      - server
confidence: medium
