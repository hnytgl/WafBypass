  - regex: ip.logged
    fields: *id001
  - regex: ip.address.logged
    fields: *id001
  - regex: not.acceptable
    fields: *id001
  - regex: unauthorized
    fields: *id001
  - regex: permission
    fields: *id001
  - regex: waf
    fields: *id001
  - regex: ids
    fields: *id001
  - regex: ips
    fields: *id001
  - regex: automated
    fields: *id001
  - regex: suspicious
    fields: *id001
  - regex: denied
    fields: *id001
  - regex: attack(ed)?
    fields: *id001
  - regex: rejected
    fields: *id001
  - regex: security
    fields: *id001
